name: Actualiser les événements OpenAgenda

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5,17 * * *"

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les événements publics
        env:
          OPENAGENDA_API_KEY: ${{ secrets.OPENAGENDA_API_KEY }}
        run: python scripts/update_events.py
      - name: Enregistrer les changements
        run: |
          if git diff --quiet -- events.json; then
            echo "Aucun changement dans events.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Actualiser les événements OpenAgenda"
          git push
